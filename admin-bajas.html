<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel interno | Sector Seguro</title><link rel="icon" href="img/favicon-sectorseguro.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--blue:#087bc1;--navy:#00366b;--ink:#121820;--muted:#697680;--line:#e0e5e9;--bg:#f7f9fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,sans-serif}.header{height:70px;padding:0 max(22px,calc((100% - 1400px)/2));background:white;border-bottom:1px solid var(--line);display:flex;align-items:center}.header h1{font-size:19px;margin:0}.header p{margin:2px 0 0;color:var(--muted);font-size:14px}.actions{margin-left:auto;display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:10px 17px;border-radius:99px;font:600 14px Figtree;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:32px 22px}.categories{display:flex;gap:10px;margin-bottom:24px}.category{border:1px solid var(--line);background:#fff;padding:13px 22px;border-radius:14px;font:700 15px Figtree;color:var(--muted);cursor:pointer}.category.active{background:var(--navy);color:#fff;border-color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 7px 22px rgba(12,35,55,.05)}.stat b{display:block;font-size:31px;margin:10px 0 2px}.stat span{color:var(--muted);font-size:14px}.reasons{background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px;margin-top:22px}.reasons h2{font-size:18px;margin:0 0 20px}.bar-row{display:grid;grid-template-columns:200px 1fr 30px;gap:12px;align-items:center;margin:12px 0;color:var(--muted);font-size:14px}.bar{height:9px;border-radius:9px;background:#eff3f7;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 20px}.filter{border:1px solid var(--line);background:white;padding:10px 17px;border-radius:99px;color:var(--muted);cursor:pointer}.filter.active{background:var(--blue);border-color:var(--blue);color:white}.list{display:grid;grid-template-columns:1fr 1fr;gap:18px}.case{background:white;border:1px solid var(--line);border-radius:22px;padding:25px}.case-head{display:flex;gap:12px;justify-content:space-between}.case h3{margin:0;font-size:19px}.meta{color:var(--muted);font-size:13px;margin-top:4px}.badge{background:#e8f3fb;color:#075985;padding:7px 12px;border-radius:99px;height:max-content;font-size:13px}.data{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;font-size:14px}.data b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:3px}.comment{background:var(--bg);padding:13px;border-radius:12px;color:#4b5563;font-size:14px;white-space:pre-wrap}.manage{display:grid;grid-template-columns:160px 1fr auto;gap:9px;margin-top:16px}select,input{border:1px solid var(--line);border-radius:10px;padding:10px;font:14px Figtree}.save{background:var(--navy);color:white;border:0;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:50px}.login{position:fixed;inset:0;background:#f7f9fb;display:grid;place-items:center;z-index:3}.login-box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;text-align:center}.login-box img{width:165px}.login-box h2{margin:10px 0 5px}.login-box p{color:var(--muted)}.login-box input{width:100%;margin:12px 0}.login-box button{width:100%;padding:12px;background:var(--blue);border:0;border-radius:12px;color:#fff;font-weight:700}.login-error{color:#b42318;font-size:13px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}}@media(max-width:600px){.categories{overflow:auto}.category{white-space:nowrap}.stats{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 25px}.data{grid-template-columns:1fr}.manage{grid-template-columns:1fr}.save{padding:11px}.header p{display:none}}
</style></head><body><div class="login" id="login"><form class="login-box" id="loginForm"><img src="img/SectorSeguroTransparente.png" alt="Sector Seguro"><h2>Panel interno</h2><p>Ingresá con tu email y contraseña.</p><input type="email" id="username" required autocomplete="username" placeholder="Email"><input type="password" id="password" required autocomplete="current-password" placeholder="Contraseña"><div class="login-error" id="loginError"></div><button>Ingresar</button></form></div><header class="header"><div><h1>Panel interno</h1><p>SectorSeguro Atención Directa</p></div><div class="actions"><button class="btn" onclick="loadData()">↻ Actualizar</button><button class="btn" onclick="logout()">Salir</button></div></header><main class="wrap"><nav class="categories" id="categories"></nav><section class="stats"><div class="stat"><span id="totalLabel">Registros recibidos</span><b id="total">0</b></div><div class="stat"><span id="pendingLabel">Pendientes</span><b id="pending">0</b><span id="pendingDetail"></span></div><div class="stat"><span id="managingLabel">En gestión</span><b id="managing">0</b><span id="managingDetail"></span></div><div class="stat"><span id="resolvedLabel">Resueltos</span><b id="resolved">0</b><span id="resolvedDetail"></span></div><div class="stat"><span id="contactedLabel">Contactados</span><b id="contacted">0</b><span id="contactedDetail"></span></div></section><section class="reasons"><h2 id="summaryTitle">Resumen</h2><div id="reasonBars"></div></section><nav class="filters" id="filters"></nav><section class="list" id="list"><div class="empty">Ingresá para consultar los registros.</div></section></main><script type="module" src="firebase-admin-api.js"></script><script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx_KH88shuaVeDeWBjnlqn8d6DzujcY-o44aHP2w_U-cR0ObEeAN0AlNXyEuAqUH4jcrw/exec';
const labels={bajas:'Bajas',siniestros:'Siniestros',leads:'Consultas y cotizaciones'},allStates=['Todos','Pendiente','En gestión','Contactado','Resuelto','Cerrado','Confirmada','Cotizando','Recuperado','Perdido','Anulada'];let records={bajas:[],siniestros:[],leads:[]},type='bajas',active='Todos';
loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{await window.firebaseAdminApi.login(username.value.trim(),password.value);await loadData()}catch(err){loginError.textContent='Email o contraseña incorrectos.'}};async function logout(){await window.firebaseAdminApi.logout();username.value='';password.value='';login.style.display='grid';records={bajas:[],siniestros:[],leads:[]};render()}
async function loadData(){if(!window.firebaseAdminApi)return;try{records=await window.firebaseAdminApi.loadAll();login.style.display='none';loginError.textContent='';render()}catch(err){login.style.display='grid';loginError.textContent='No se pudo acceder al panel.'}}
function setType(next){type=next;active='Todos';render()}
function render(){const items=records[type]||[];categories.innerHTML=Object.entries(labels).map(([k,v])=>`<button class="category ${k===type?'active':''}" onclick="setType('${k}')">${v} (${records[k].length})</button>`).join('');totalLabel.textContent=labels[type]+' recibidos';total.textContent=items.length;[pendingDetail,managingDetail,resolvedDetail,contactedDetail].forEach(x=>x.textContent='');if(type==='bajas'){const scored=items.filter(x=>Number(x.puntuacion)>0),avg=scored.length?scored.reduce((a,x)=>a+Number(x.puntuacion),0)/scored.length:0,moods={Triste:1,Medio:2,Feliz:3,Excelente:4},moodItems=items.filter(x=>moods[x.experiencia]),moodAvg=moodItems.length?moodItems.reduce((a,x)=>a+moods[x.experiencia],0)/moodItems.length:0,recoveredCount=items.filter(x=>x.estado==='Recuperado').length,lostCount=items.filter(x=>x.estado==='Perdido').length;pendingLabel.textContent='Promedio de puntuación';pending.textContent=avg.toFixed(1);pendingDetail.textContent='Escala 1 a 10';managingLabel.textContent='Promedio NPS (caritas)';managing.textContent=moodAvg.toFixed(2);managingDetail.textContent='1 triste · 4 excelente';resolvedLabel.textContent='Clientes recuperados';resolved.textContent=items.length?Math.round(recoveredCount/items.length*100)+'%':'0%';resolvedDetail.textContent=recoveredCount+' caso'+(recoveredCount===1?'':'s');contactedLabel.textContent='Clientes perdidos';contacted.textContent=items.length?Math.round(lostCount/items.length*100)+'%':'0%';contactedDetail.textContent=lostCount+' caso'+(lostCount===1?'':'s')}else{pendingLabel.textContent='Pendientes';pending.textContent=items.filter(x=>x.estado==='Pendiente').length;managingLabel.textContent='En gestión';managing.textContent=items.filter(x=>x.estado==='En gestión'||x.estado==='Cotizando').length;resolvedLabel.textContent='Resueltos';resolved.textContent=items.filter(x=>['Resuelto','Cerrado','Recuperado','Confirmada'].includes(x.estado)).length;contactedLabel.textContent='Contactados';contacted.textContent=items.filter(x=>x.estado==='Contactado').length}const field=type==='bajas'?'motivo':type==='siniestros'?'tipoSeguro':'seguro';summaryTitle.textContent=type==='bajas'?'Motivos de baja':type==='siniestros'?'Tipos de siniestro':'Seguros consultados';const counts={};items.forEach(x=>{const k=x[field]||'Sin especificar';counts[k]=(counts[k]||0)+1});const max=Math.max(1,...Object.values(counts));reasonBars.innerHTML=Object.entries(counts).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('')||'<span class="meta">Aún no hay datos.</span>';const used=['Todos',...new Set(items.map(x=>x.estado||'Pendiente'))];filters.innerHTML=used.map(s=>`<button class="filter ${s===active?'active':''}" onclick="active='${esc(s)}';render()">${esc(s)}</button>`).join('');const shown=active==='Todos'?items:items.filter(x=>x.estado===active);list.innerHTML=shown.map(card).join('')||'<div class="empty">No hay registros en este estado.</div>'}
function card(x){const name=esc((x.nombre||'')+' '+(x.apellido||'')),phone=x.whatsapp?`<a href="https://wa.me/${digits(x.whatsapp)}" target="_blank">${esc(x.whatsapp)}</a>`:'—';let details='',comment=x.comentarios||'';if(type==='bajas'){details=`<div><b>DNI</b>${esc(x.dni)}</div><div><b>Póliza</b>${esc(x.compania)} · ${esc(x.patente)}</div><div><b>Experiencia</b>${esc(x.experiencia)} · ${x.puntuacion}/10</div><div><b>Motivo</b>${esc(x.motivo)}</div>`}else if(type==='siniestros'){details=`<div><b>DNI</b>${esc(x.dni)}</div><div><b>Seguro</b>${esc(x.tipoSeguro)}</div><div><b>Fecha del siniestro</b>${esc(x.fechaSiniestro)} ${esc(x.hora)}</div><div><b>Lugar</b>${esc(x.lugar)} · ${esc(x.localidad)}</div><div><b>Daños</b>${esc(x.danos||'Sin detalle')}</div>`;comment=x.descripcion+(x.comentarios?'\n'+x.comentarios:'')}else{details=`<div><b>Seguro consultado</b>${esc(x.seguro)}</div><div><b>Vehículo</b>${esc([x.marca,x.modelo,x.anio].filter(Boolean).join(' '))}</div>`}const id=safeId(x.key);return `<article class="case"><div class="case-head"><div><h3>${name.trim()||'Sin nombre'}</h3><div class="meta">${esc(x.fecha)}</div></div><span class="badge">${esc(x.estado||'Pendiente')}</span></div><div class="data"><div><b>WhatsApp</b>${phone}</div><div><b>Email</b>${esc(x.email||'—')}</div>${details}</div><div class="comment">${esc(comment||'Sin comentarios')}</div><div class="manage"><select id="st-${id}">${allStates.slice(1).map(s=>`<option ${s===x.estado?'selected':''}>${s}</option>`).join('')}</select><input id="nt-${id}" value="${attr(x.notas||'')}" placeholder="Notas internas"><button class="save" onclick="save('${x.key}')">Guardar</button></div></article>`}
async function save(recordKey){const id=safeId(recordKey),estado=document.getElementById('st-'+id).value,notas=document.getElementById('nt-'+id).value;await window.firebaseAdminApi.save(type,recordKey,estado,notas);const x=records[type].find(i=>i.key===recordKey);x.estado=estado;x.notas=notas;render()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}function safeId(v){return String(v).replace(/[^a-zA-Z0-9]/g,'-')}function digits(v){let d=String(v).replace(/\D/g,'');return d.startsWith('54')?d:'54'+d}render();window.addEventListener('firebase-admin-ready',()=>window.firebaseAdminApi.onSession(user=>{if(user)loadData();else login.style.display='grid'}));
</script></body></html>
